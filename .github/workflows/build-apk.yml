name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect active Java major version from:" >&2
            echo "$JAVA_VERSION_OUTPUT" >&2
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than required version 17." >&2
            exit 1
          fi

          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "Checking for ./debug.keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore." >&2
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Checking for expected APK at: $EXPECTED_APK"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for generated APKs:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK" >&2; exit 1 ;;
          esac

          echo "Verified APK successfully:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TEMP_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/^-*//;s/-*$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SRC_APK" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at '$ASSET_PATH'." >&2
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset at '$ASSET_PATH' is empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH" >&2; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          ### NOVA AI — Debug APK Build #${{ github.run_number }}

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number**: ${{ github.run_number }}
          - **Workflow Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: \`${{ github.sha }}\`
          - **Asset Filename**: \`${ASSET_NAME}\`

          > **Notice**:
          > - This APK is intended for testing and development preview.
          > - This is not a Google Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag '$RELEASE_TAG'..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "GitHub Release published successfully."
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          REPO="${{ github.repository }}"

          echo "=== APK Build & Release Summary ==="

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Confirming release details via GitHub CLI..."
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded

          - **Release Title**: ${RELEASE_TITLE}
          - **Release Tag**: \`${RELEASE_TAG}\`
          - **APK File**: \`${ASSET_NAME}\`
          - **Direct Download**: [Download from GitHub Release](${RELEASE_URL})

          The APK is available directly under the release **Assets** section on your phone or computer.
          The standard GitHub Actions artifact **\`app-debug-apk\`** is also available as a backup.
          EOF
          else
            echo "WARNING: GitHub Release publishing did not succeed or was skipped."
            echo "The APK build completed successfully, and the GitHub Actions artifact remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ APK Build Succeeded (Release Publishing Warning)

          The debug APK was built successfully and saved as a GitHub Actions artifact.

          - **Artifact Name**: \`app-debug-apk\`
          - **Download Instructions**: Download the \`app-debug-apk\` zip artifact from the GitHub Actions run summary page.
          - **Status**: Release publishing encountered an issue or was skipped, but the compiled APK is safe and preserved in Actions artifacts.
          EOF
          fi
